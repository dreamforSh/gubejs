buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// The sources are UTF-8. Without this javac decodes them with the platform charset, which turns
// every non-ASCII character in a comment into a warning and every one in a string literal into
// silent corruption on a machine whose locale is not UTF-8.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * Finds the Graal mod jar this project compiles and runs against.
 *
 * <p>Graal is a separate mod carrying the JavaScript engine, not a Maven artifact, so it is
 * located on disk rather than resolved. Two places are searched, in order:
 *
 * <ol>
 *   <li>{@code libs/}, for a checkout that wants to be self-contained;
 *   <li>the sibling Graal project's build output, which is what a workspace with both repos has.
 * </ol>
 *
 * <p>The <em>dev</em> classifier matters: that jar is the shadow jar before reobfuscation, so its
 * calls into {@code net.minecraft} use the official names a dev run resolves. The reobfuscated one
 * would fail to link here.
 *
 * @param dev whether to look for the un-reobfuscated jar
 */
def findGraalJar(boolean dev) {
    var suffix = dev ? '-dev.jar' : '.jar'
    var candidates = []

    var local = file('libs')
    if (local.isDirectory()) {
        candidates.addAll(local.listFiles().findAll { it.name.startsWith('Graal-') })
    }

    var sibling = file(graal_project_dir + '/build/libs')
    if (sibling.isDirectory()) {
        candidates.addAll(sibling.listFiles().findAll { it.name.startsWith('Graal-') })
    }

    var match = candidates.find { it.name.endsWith(suffix) && !it.name.endsWith('-slim.jar') }
    if (match == null) {
        throw new GradleException(
            "Could not find the Graal${dev ? ' dev' : ''} jar. Build it with " +
                "`gradlew ${dev ? 'shadowJar -PmodJarRun' : 'build'}` in ${file(graal_project_dir)}, " +
                "or drop the jar into ${local}."
        )
    }
    return match
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Forge 1.19.2's mod loader has no mixin support of its own: published jars are picked
            // up through the "MixinConfigs" manifest attribute, which a dev run launched from
            // classes directories does not have. Register the config with ModLauncher's mixin
            // transformation service directly instead.
            arg "--mixin.config=${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The Graal mod, which carries GraalJS and the Forge wiring around it. Compile-only on
    // purpose: it is a separate mod the player installs, and putting it on the runtime classpath
    // here would only produce a second copy that Forge's transforming loader never sees. Dev runs
    // get it the way the game does, from run/mods -- see copyGraalMod below.
    compileOnly files(findGraalJar(true))
    implementation fileTree(dir: 'libs', includes: ['*.jar'])
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Graal's mixins apply while its own classes are transformed, which only happens for a jar loaded
// as a mod. A dev run therefore needs the real jar in run/mods, exactly as production does --
// without it, the host access registry mixin is missing and building a script context fails.
var copyGraalMod = tasks.register('copyGraalMod', Copy) {
    description = 'Places the Graal mod jar in the run directory so dev launches can load it'
    from findGraalJar(true)
    into file('run/mods')
}

var copyGraalModData = tasks.register('copyGraalModData', Copy) {
    from findGraalJar(true)
    into file('run-data/mods')
}

tasks.matching { it.name.startsWith('run') && it.hasProperty('minecraftArtifacts') }.configureEach {
    dependsOn it.name == 'runData' ? copyGraalModData : copyGraalMod
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             graal_version_range : graal_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    // Forge 1.19.2 delegates mixin discovery entirely to Mixin itself, which reads
                    // this attribute off every mod container it finds. Without it no mixin applies.
                    "MixinConfigs"            : "${mod_id}.mixins.json"])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}
