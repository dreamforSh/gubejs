modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/dreamforSh/Gubejs/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The JavaScript engine. Loaded before this mod so that its member remapper and host access
# mixins are in place before the first script context is built.
[[dependencies."${mod_id}"]]
modId = "graal"
mandatory = true
versionRange = "${graal_version_range}"
ordering = "AFTER"
side = "BOTH"
