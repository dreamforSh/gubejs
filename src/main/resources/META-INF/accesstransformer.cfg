# A block's properties object is where the state properties a script asked for have to travel.
# Not for convenience: the game asks a block for its state properties from inside the Block
# constructor, before any field of a subclass has been assigned, so a subclass cannot answer from
# one of its own fields. The properties object is the only thing that exists by then, because
# BlockBehaviour assigns it before the state definition is built, so the builder rides along on a
# subclass of it -- and that subclass needs the constructor.
public net.minecraft.world.level.block.state.BlockBehaviour$Properties <init>(Lnet/minecraft/world/level/material/Material;Ljava/util/function/Function;)V
